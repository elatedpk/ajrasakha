name: Reviewer System E2E

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

jobs:
  reviewer-e2e:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment_status.environment_url, 'ajrasakha-staging-594'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Install E2E dependencies
        working-directory: qa/reviewer-e2e
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: qa/reviewer-e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public route and sign-in checks
        working-directory: qa/reviewer-e2e
        run: pnpm test:smoke
        env:
          CI: true
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}

      - name: Run role-based staging UI suite
        working-directory: qa/reviewer-e2e
        run: pnpm test:staging
        env:
          CI: true
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewer-playwright-report
          path: |
            qa/reviewer-e2e/playwright-report/
            qa/reviewer-e2e/test-results/
          retention-days: 30
